spring.application.name=alnet
spring.datasource.url=jdbc:mysql://${DB_SERVICE_NAME}:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8db.url=jdbc:mysql://mysql:3306/resume?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_USER_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
auth.jwt.singing.key=${JWT_SINGING_KEY}
auth.jwt.duration.expiration.access=${JWT_DURATION_ACCESS}
auth.jwt.duration.expiration.refresh=${JWT_DURATION_REFRESH}
auth.anonymous.key=${ANONYMOUS_AUTH_KEY}
spring.jpa.hibernate.ddl-auto=update
frontend.port=3000
server.servlet.context-path=/alnet
logging.level.org.springframework.web=DEBUG