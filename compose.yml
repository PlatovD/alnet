services:
  node_alnet:
    build: ./front
    container_name: node_alnet
    expose:
      - 3000
    env_file:
      - .env
    networks:
      - app
    command: npm run dev
    depends_on:
      - spring_alnet

  rabbitmq_alnet:
    image: rabbitmq:4.2-alpine
    container_name: rabbitmq_alnet
    restart: always
    env_file:
      - .env
    networks:
      - app
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_NODE_PORT=${RABBITMQ_NODE_PORT}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    command: >
      /bin/sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    expose:
      - 61613
      - 5672

  nginx_alnet:
    image: nginx:1.25-alpine
    container_name: nginx_alnet
    restart: always
    networks:
      - app
    expose:
      - 80
    volumes:
      - ./nginx:/etc/nginx/conf.d
    command: >
      sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - spring_alnet

  spring_alnet:
    build: .
    container_name: spring_alnet
    restart: always
    expose:
      - 8080
    environment:
      - SPRING_CONFIG_NAME=application
    env_file:
      - .env
    networks:
      - app
    depends_on:
      - mysql_alnet
      - rabbitmq_alnet

  mysql_alnet:
    image: mysql:8.0.43
    container_name: mysql_alnet
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_USER_PASSWORD}
    networks:
      - app
    expose:
      - 3306

networks:
  app:
    driver: bridge
  public_net:
    external: true

volumes:
  mysql_data:
  rabbitmq:
